# Historical windows (start -> end, last observed day on or before each date). Shocks are recomputed from the series.
historical:
  lehman_2008:  {start: "2008-09-12", end: "2008-10-10"}
  sovereign_2011: {start: "2011-07-01", end: "2011-11-25"}
  covid_2020:   {start: "2020-02-19", end: "2020-03-23"}
  rates_2022:   {start: "2021-12-31", end: "2022-10-21"}
  svb_2023:     {start: "2023-03-08", end: "2023-03-17"}
# Hypothetical: only the listed factors are shocked (bp for rates and spreads, log-change otherwise);
# the others are completed by conditional expectation (propagation module).
hypothetical:
  stagflation: {eur_10y: 150, us_10y: 150, sx5e: -0.15}
  fragmentation: {eur_sov_spread: 150}
  flight_to_quality: {sx5e: -0.25}
  strong_dollar: {eurusd: -0.15, us_2y: 100}
